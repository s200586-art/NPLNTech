<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NPLN Tech premium animated logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02050b"/>
      <stop offset="55%" stop-color="#061120"/>
      <stop offset="100%" stop-color="#081a2d"/>
    </linearGradient>

    <radialGradient id="auraGrad" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00E5FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b6979"/>
      <stop offset="48%" stop-color="#00d8f0"/>
      <stop offset="100%" stop-color="#68f6ff"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#74f9ff"/>
      <stop offset="42%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#9bfdff"/>
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9bf8ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2438" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04080f" stop-opacity="1"/>
    </radialGradient>

    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="panelClip">
      <rect x="220" y="190" width="1160" height="520" rx="34"/>
    </clipPath>

    <style>
      .trace {
        stroke-dasharray: 11 13;
        animation: traceFlow 7.2s linear infinite;
      }
      .trace.slow { animation-duration: 10.5s; }
      .trace.rev { animation-direction: reverse; }

      .panel-breathe {
        animation: breathe 4.8s ease-in-out infinite;
      }

      .brand-pulse {
        animation: brandPulse 3.6s ease-in-out infinite;
      }

      .sheen {
        animation: sweep 7.4s ease-in-out infinite;
      }

      .node {
        animation: nodePulse 2.6s ease-in-out infinite;
      }
      .node.d2 { animation-delay: .8s; }
      .node.d3 { animation-delay: 1.6s; }

      @keyframes traceFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -340; }
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 1; }
      }

      @keyframes brandPulse {
        0%, 100% { opacity: .92; }
        50% { opacity: 1; }
      }

      @keyframes sweep {
        0% { transform: translateX(-980px); }
        46%, 100% { transform: translateX(1920px); }
      }

      @keyframes nodePulse {
        0%, 100% { opacity: .38; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      @media (prefers-reduced-motion: reduce) {
        .trace, .panel-breathe, .brand-pulse, .sheen, .node {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#auraGrad)"/>

  <g opacity="0.82" fill="none" stroke="url(#traceGrad)" stroke-width="3.1" stroke-linecap="round">
    <path class="trace" d="M86 170H470V250H720"/>
    <path class="trace slow" d="M86 730H540V650H720"/>
    <path class="trace rev" d="M1514 170H1130V250H880"/>
    <path class="trace slow rev" d="M1514 730H1060V650H880"/>
    <path class="trace" d="M800 74V205"/>
    <path class="trace slow rev" d="M800 826V694"/>
  </g>

  <g class="panel-breathe">
    <rect x="220" y="190" width="1160" height="520" rx="34" fill="#07111d" fill-opacity="0.78" stroke="#00E5FF" stroke-opacity="0.35"/>
    <rect x="234" y="204" width="1132" height="492" rx="22" fill="none" stroke="#00E5FF" stroke-opacity="0.2"/>
  </g>

  <g clip-path="url(#panelClip)">
    <rect class="sheen" x="-980" y="100" width="760" height="760" fill="url(#sheenGrad)" transform="rotate(-12 800 450)"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="800" cy="450" r="170" fill="#00E5FF" fill-opacity="0.07"/>
    <rect x="706" y="296" width="188" height="308" rx="20" fill="url(#coreGrad)" stroke="#00E5FF" stroke-opacity="0.48"/>
    <g stroke="#00E5FF" stroke-opacity="0.42" stroke-width="2.4" fill="none">
      <path d="M706 330H620V280H540"/>
      <path d="M706 372H580V322H492"/>
      <path d="M706 530H600V580H510"/>
      <path d="M706 572H564V622H470"/>
      <path d="M894 330H980V280H1060"/>
      <path d="M894 372H1020V322H1108"/>
      <path d="M894 530H1000V580H1090"/>
      <path d="M894 572H1036V622H1130"/>
    </g>
  </g>

  <g class="brand-pulse" filter="url(#textGlow)">
    <text x="260" y="500" fill="#00cfe8" fill-opacity="0.24" font-family="'JetBrains Mono','Fira Mono','Consolas',monospace" font-size="148" font-weight="700">&gt; NPLN Tech_</text>
    <text x="248" y="490" fill="url(#textGrad)" font-family="'JetBrains Mono','Fira Mono','Consolas',monospace" font-size="148" font-weight="700">&gt; NPLN Tech_</text>
  </g>

  <g fill="#00E5FF" filter="url(#softGlow)">
    <circle class="node" cx="156" cy="180" r="7.8"/>
    <circle class="node d2" cx="1450" cy="162" r="7.8"/>
    <circle class="node d3" cx="1432" cy="742" r="7.8"/>
    <circle class="node d2" cx="176" cy="740" r="7.8"/>
  </g>
</svg>
