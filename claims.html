function stats(){
  var n=0,ip=0,r=0,s=0,o=0,risk=0;
  for(var i=0;i<claims.length;i++){
    var c=claims[i];
    if(c.status==='new')n++;
    if(c.status==='in_progress')ip++;
    if(c.status==='regress')r++;
    if(c.status==='resolved')s++;
    if(c.days<0){o++;risk+=c.amount*0.01*Math.abs(c.days);}
  }
  return{n:n,ip:ip,r:r,s:s,o:o,risk:risk,total:claims.length};
}

function pct(id){
  var t=0,c=0;
  for(var i=0;i<steps.length;i++){
    var st=steps[i];
    for(var j=0;j<st.tasks.length;j++){
      var tk=st.tasks[j];
      if(tk.r){
        t++;
        if(progress[id]&&progress[id][st.id]&&progress[id][st.id][tk.id])c++;
      }
    }
  }
  return t?Math.round(c/t*100):0;
}

function tog(cid,sid,tid){
  if(!progress[cid])progress[cid]={};
  if(!progress[cid][sid])progress[cid][sid]={};
  progress[cid][sid][tid]=!progress[cid][sid][tid];
  render();
}

function setView(v,id){
  view=v;claimId=id||null;
  if(v==='dashboard')statusFilter=null;
  render();
}

function filterByStatus(st){
  if(statusFilter===st){statusFilter=null;}
  else{statusFilter=st;}

}

  theme=theme==='dark'?'light':'dark';

}

function copy(text,btnId){
  navigator.clipboard.writeText(text);
  var btn=document.getElementById(btnId);
  if(btn){var orig=btn.innerHTML;btn.innerHTML='✓ Скопировано';setTimeout(function(){btn.innerHTML=orig;},1500);}
}

  if(!answers[cid])return 0;

}

  var t=0;
  for(var i=0;i<questionnaire.sections.length;i++){
    t+=questionnaire.sections[i].questions.length;
  }
  return t;
}

function createClaim(){
  var name=document.getElementById('f_name')?.value;
  var product=document.getElementById('f_product')?.value;
  if(!name||!product){alert('Заполните обязательные поля!');return;}
  var newId=Math.max.apply(null,claims.map(function(c){return c.id;}))+1;
  claims.push({
    id:newId,
    customer:name,
    phone:document.getElementById('f_phone')?.value||'',
    product:product,
    status:'new',
    days:10,
    amount:parseInt(document.getElementById('f_amount')?.value)||0,
    channel:document.getElementById('f_channel')?.value||'store',
    type:document.getElementById('f_type')?.value||'',
    date:document.getElementById('f_date')?.value||new Date().toISOString().split('T')[0],
    issue:document.getElementById('f_issue')?.value||''

  setView('claim',newId);
}
